<html lang="en"><head>

    <!-- Section 2.1: Linking the external CSS Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>


    <title>Inquiry Form - Thembi's Kitchen</title>
    
</head>
<body>
<!--Main header displaying the food stall name -->
<header>
	<div class="hearder-container">
	<h1> THEMBI'S KITCHEN</h1>
	<!-- Navigation bar separating different menu links with pipe dividers -->

  <nav>
		<ul>
			<li><a href="index.html">INDEX</a></li>
            <li><a href="aboutUs.html" class=>ABOUT US</a></li> 
            <li><a href="services.html">SERVICES</a></li> 
            <li><a href="contactUs.html">CONTACT US</a></li>
            <li><a href="inquiry.html"class="active">INQUIRY</a></li>
		</ul>
	</nav>
	</div>
</header>

    <!-- Main semantic content container displaying the central form wireframe -->
    <main class="form-container">
        <!-- Subheading identifying the primary objective of this webpage -->
        <h2>INQUIRY FORM PAGE</h2>
        
        <!-- Interactive form element handling user inputs securely -->
        <form action="#" method="POST">
            
            <!-- Form field row block for the customer's full name -->
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <!-- Form field row block for the primary telephone or contact details -->
            <div class="form-group">
                <label for="phone">Contact Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <!-- Form field row block for email address data entry -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Form field row block for long-form user inquiries or text notes -->
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
            </div>

            <!-- Bottom action submission row centered block -->
            <div class="form-submit">
                <button type="submit">[ SUBMIT ]</button>
            </div>
            
        </form>
    </main>

    <!-- Structural site footer displaying copyright status and creation year -->
    <footer>
        <p>Footer: &copy; 2026 Thembi's Kitchen. All rights reserved.</p>
    </footer>

</body>
</html>
